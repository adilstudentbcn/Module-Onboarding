<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>

         <!-- 1. Customer Name (min 2 characters, required) -->
        <div>
        <label for="customerName">Customer Name:</label>
        <input type="text" id="customerName" name="customerName" autocomplete="name" minlength="2" required />
        </div>

        <!-- 2. Customer Email (valid email, required) -->
        <div>
        <label for="customerEmail">Customer Email:</label>
        <input type="email" id="customerEmail" name="customerEmail" autocomplete="email" required />
        </div>

        <!-- 3. T-Shirt Colour (3 options, required) -->
        <div>
        <label for="tshirtColour">T-Shirt Colour:</label>
        <select id="tshirtColour" name="tshirtColour" required>
          <option value="">Select a colour</option>
          <option value="red">Red</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
        </select>
        </div>

        <!-- 4. T-Shirt Size (6 options: XS, S, M, L, XL, XXL, required) -->
        <div>
        <label for="tshirtSize">T-Shirt Size:</label>
        <select id="tshirtSize" name="tshirtSize" required>
          <option value="">Select a size</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select> 

        <!-- 5. Submit Button -->
        <div>
        <button type="submit">Submit</button>
        </div>

      </form>
    </main>
    <footer>
            <h2>By Adil B</h2>
    </footer>
  </body>
</html>
