<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- write your html here-->

        <!-- 1. Customer Name (min 2 characters, required) -->
         <label for="customerName">Customer Name:</label>
        <input type="text" id="customerName" name="customerName" minlength="2" required />

        <!-- 2. Customer Email (valid email, required) -->
        <label for="customerEmail">Customer Email:</label>
        <input type="email" id="customerEmail" name="customerEmail" required />

        <!-- 3. T-Shirt Colour (3 options, required) -->
        <label for="tshirtColour">T-Shirt Colour:</label>
        <select id="tshirtColour" name="tshirtColour" required>
          <option value="">Select a colour</option>
          <option value="red">Red</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
        </select>

        <!-- 4. T-Shirt Size (6 options: XS, S, M, L, XL, XXL, required) -->
        <label for="tshirtSize">T-Shirt Size:</label>
        <select id="tshirtSize" name="tshirtSize" required>
          <option value="">Select a size</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select> 

        <!-- 5. Submit Button -->
        <button type="submit">Submit</button>


        <!-- 
          try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By Adil B</h2>
    </footer>
  </body>
</html>
